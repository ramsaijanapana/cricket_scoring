name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build-api:
    name: Build API Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/api
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-web:
    name: Build Web Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/web
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-api, build-web]
    environment: staging
    permissions:
      contents: read
      packages: read
    env:
      REGISTRY: ghcr.io
      IMAGE_PREFIX: ${{ github.repository }}
      IMAGE_TAG: ${{ github.sha }}
      WEB_PORT: "8080"
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create staging .env
        env:
          STAGING_POSTGRES_PASSWORD: ${{ secrets.STAGING_POSTGRES_PASSWORD }}
          STAGING_JWT_SECRET: ${{ secrets.STAGING_JWT_SECRET }}
          STAGING_JWT_REFRESH_SECRET: ${{ secrets.STAGING_JWT_REFRESH_SECRET }}
          STAGING_ALLOWED_ORIGINS: ${{ vars.STAGING_ALLOWED_ORIGINS }}
        run: |
          cat > .env <<EOF
          POSTGRES_USER=cricket
          POSTGRES_PASSWORD=${STAGING_POSTGRES_PASSWORD:-staging-postgres-password-change-me}
          POSTGRES_DB=cricket_scoring
          JWT_SECRET=${STAGING_JWT_SECRET:-staging-jwt-secret-at-least-32-characters-long}
          JWT_REFRESH_SECRET=${STAGING_JWT_REFRESH_SECRET:-staging-refresh-secret-at-least-32-chars}
          ALLOWED_ORIGINS=${STAGING_ALLOWED_ORIGINS:-http://localhost:8080}
          API_PORT=3001
          WEB_PORT=${WEB_PORT}
          APP_VERSION=${IMAGE_TAG}
          EOF

      - name: Pull staging images
        run: docker compose -f docker-compose.staging.yml pull

      - name: Run database migrations
        run: docker compose -f docker-compose.staging.yml --profile migrate run --rm migrate

      - name: Deploy staging stack
        run: docker compose -f docker-compose.staging.yml up -d

      - name: Smoke test — health via nginx
        run: |
          echo "Waiting for nginx /health (API proxied through web)..."
          for i in $(seq 1 36); do
            if curl -sf "http://localhost:${WEB_PORT}/health" | grep -q '"status":"ok"'; then
              echo "Staging smoke test passed"
              curl -s "http://localhost:${WEB_PORT}/health"
              exit 0
            fi
            sleep 5
          done
          echo "Staging smoke test failed"
          docker compose -f docker-compose.staging.yml ps
          docker compose -f docker-compose.staging.yml logs --tail=100
          exit 1

      - name: Tear down staging stack
        if: always()
        run: docker compose -f docker-compose.staging.yml down -v

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    environment:
      name: production
      # Requires manual approval in GitHub environment settings
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "Deploying to production environment..."
          echo "API image: ${{ needs.build-api.outputs.image-tag }}"
          echo "Web image: ${{ needs.build-web.outputs.image-tag }}"
          # Replace with actual deployment commands
